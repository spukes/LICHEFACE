[package]
name = "licheface"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "licheface"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.30", features = ["default"] }
egui = "0.30"
egui_extras = { version = "0.30", features = ["image", "svg"] }
shakmaty = "0.27"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
open = "5"
rodio = { version = "0.19", features = ["symphonia-mp3"] }

[profile.release]
opt-level = 3
strip = true
lto = true

[package.metadata.winres]
FileDescription = "LICHEFACE - Lichess Desktop Client"
ProductName = "LICHEFACE"
